name: Desktop app

# The desktop app builds apart from the workspace, against Qt, so it has a job
# of its own that runs only when the app or the crates it uses change. Those
# crates' tests run with the workspace's, in CI.
on:
  push:
    branches: [main]
    paths:
      - apps/desktop-linux/**
      - crates/coversync-desktop-core/**
      - crates/coversync-proxy/**
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - apps/desktop-linux/**
      - crates/coversync-desktop-core/**
      - crates/coversync-proxy/**
      - .github/workflows/desktop.yml

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-qt:
    name: Linux app (Qt 6)
    runs-on: ubuntu-latest
    # The app needs Qt 6.9 or later with Qt WebEngine; Ubuntu 24.04 has
    # 6.4. Arch Linux has the current one, and Rust with Clippy and rustfmt.
    container: archlinux:latest
    steps:
      - name: Install Qt 6 and Rust
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rust qt6-base qt6-declarative qt6-webengine
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-linux
      - name: rustfmt
        working-directory: apps/desktop-linux
        run: cargo fmt --check
      - name: Clippy
        working-directory: apps/desktop-linux
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        working-directory: apps/desktop-linux
        run: cargo test --locked
      - name: Build
        working-directory: apps/desktop-linux
        run: cargo build --locked --release
