[package]
name = "coversync-cli"
version = "0.1.0"
description = "coversync's command for a computer that keeps a copy of the Library: the background sync agent"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "coversync_cli"

[[bin]]
name = "coversync"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
coversync-desktop-core = { path = "../coversync-desktop-core" }
coversync-proxy = { path = "../coversync-proxy" }
coversync-replica = { version = "0.1.0", path = "../coversync-replica" }
futures-util = { version = "0.3.34", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The system bus: NetworkManager, UPower and logind. The version and runtime oo7 already brings.
zbus = { version = "6.2.1", default-features = false, features = ["proxy", "tokio"] }
