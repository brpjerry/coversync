[package]
name = "coversync-desktop-core"
version = "0.1.0"
description = "What the desktop apps share, apart from their windows: settings, servers and their proxies, launches"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
coversync-proxy = { path = "../coversync-proxy" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
