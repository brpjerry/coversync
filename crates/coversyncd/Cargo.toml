[package]
name = "coversyncd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
coversync-core = { version = "0.1.0", path = "../coversync-core" }
coversync-protocol = { version = "0.1.0", path = "../coversync-protocol" }
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
libc = "0.2.191"
mime_guess = "2.0.5"
rayon = "1.12.0"
rpassword = "7.5.4"
rusqlite = "0.41.0"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
coversync-cli = { version = "0.1.0", path = "../coversync-cli" }
coversync-desktop-core = { version = "0.1.0", path = "../coversync-desktop-core" }
coversync-proxy = { version = "0.1.0", path = "../coversync-proxy" }
coversync-replica = { version = "0.1.0", path = "../coversync-replica" }
