[package]
name = "coversync-replica"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The sync engine: runs the server's sync plans in a device's folder"

[dependencies]
blake3 = "1.8.7"
bytes = "1.12.1"
coversync-protocol = { version = "0.1.0", path = "../coversync-protocol" }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "rustls-platform-verifier", "tls12", "logging"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "macros", "rt", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

# Folders opened one name at a time, never following a link.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
