[package]
name = "coversync-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# Clients (the sync engine, Android) build without default features: the
# index and its queries, file hashes and the settings types, and nothing
# that decodes images or calls MusicBrainz. `server` adds what only
# coversyncd runs: imports, identifying albums online, uploads into the
# Inbox, and the cover pass with its thumbnails. CI builds the client set
# for Android, ARM Linux and Windows.
[features]
default = ["server"]
server = ["dep:flate2", "dep:getrandom", "dep:image", "dep:rustix", "dep:ureq", "dep:walkdir"]

# It imports albums and runs the cover pass.
[[test]]
name = "change_counter"
required-features = ["server"]

# It plans imports.
[[test]]
name = "import_structure"
required-features = ["server"]

[dependencies]
coversync-protocol = { version = "0.1.0", path = "../coversync-protocol" }
image = { version = "0.25.10", optional = true, default-features = false, features = ["jpeg", "png", "webp", "gif"] }
flate2 = { version = "1.1.10", optional = true }
getrandom = { version = "0.4.3", optional = true }
lofty = "0.25.5"
rayon = "1.12.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tracing = "0.1.44"
ureq = { version = "3.5.0", optional = true, features = ["json"] }
walkdir = { version = "2.5.0", optional = true }
blake3 = "1.8.7"

# Linux file clones and I/O priority, access(2) and the uploads' disk calls;
# moving Library files one name at a time, never following a link.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["fs"], optional = true }
