[package]
name = "coversync-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
libc = "0.2.191"
lofty = "0.25.5"
rayon = "1.12.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tracing = "0.1.44"
ureq = { version = "3.5.0", features = ["json"] }
walkdir = "2.5.0"
