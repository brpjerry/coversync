# cargo-about's configuration for the Rust crates in THIRD-PARTY-NOTICES.
# For a crate with a choice of licenses, the first one listed here is used.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "0BSD",
  "Unlicense",
  "CDLA-Permissive-2.0",
]
targets = ["x86_64-unknown-linux-gnu"]
# Only what's compiled into coversyncd; coversync's own crates aren't third-party.
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
