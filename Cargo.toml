[workspace]
resolver = "3"
members = ["crates/coversync-core", "crates/coversync-desktop-core", "crates/coversync-proxy", "crates/coversyncd"]
# The desktop app builds on its own, with its own lockfile: it needs Qt.
exclude = ["apps/desktop-linux"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[profile.release]
lto = "thin"
codegen-units = 4
