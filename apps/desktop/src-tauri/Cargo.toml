[package]
name = "coversync-desktop"
version = "0.1.0"
description = "The coversync desktop app: a window onto a coversync server"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

# Its own workspace, apart from the repository's: it needs WebKitGTK to build.
[workspace]

# `features = []` is how the Tauri CLI writes these; it rewrites them on every
# build otherwise.
[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
coversync-proxy = { path = "../../../crates/coversync-proxy" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-single-instance = "2.5.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# The webview itself, to notice when its web process dies. The version is
# the one Tauri's wry uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"
